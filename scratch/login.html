<!DOCTYPE html>
<html lang="id">
<head>
    <title id="title">ALJUANDRI.NET WiFi > Login</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0F172A;
            background-image: radial-gradient(circle at 50% -20%, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        
        .logo-text span {
            color: #f8fafc;
        }

        .mode-selector {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .info-text {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .pricing-section {
            margin-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 24px;
        }

        .pricing-title {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 16px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pricing-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .pricing-table th {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            padding: 0 12px 8px;
            text-transform: uppercase;
        }

        .pricing-table td {
            background: rgba(15, 23, 42, 0.4);
            padding: 12px;
            font-size: 13px;
            color: #e2e8f0;
        }

        .pricing-table tr td:first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
            font-weight: 600;
            color: #38bdf8;
        }

        .pricing-table tr td:last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            font-weight: 700;
            text-align: right;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }

        .footer a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post" style="display:none;">
        <input type="hidden" name="username" />
        <input type="hidden" name="password" />
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
    </form>
    <script type="text/javascript" src="md5.js"></script>
    <script type="text/javascript">
        function doLogin() {
            document.sendin.username.value = document.login.username.value;
            document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
            document.sendin.submit();
            return false;
        }
    </script>
    $(endif)

    <div class="glass-container">
        <div class="logo-container">
            <!-- Jika ingin menggunakan gambar logo, hilangkan komentar baris di bawah dan hapus div logo-text -->
            <!-- <img src="img/logo1.png" alt="Logo" style="max-width: 150px; border-radius: 12px;"> -->
            <div class="logo-text">ALJUANDRI<span>.NET</span></div>
        </div>

        <div class="mode-selector">
            <button id="btn-voucher" class="mode-btn active" onclick="setMode('voucher')">Voucher</button>
            <button id="btn-member" class="mode-btn" onclick="setMode('member')">Member</button>
        </div>

        <div class="info-text" id="infologin">
            Masukkan Kode Voucher Anda untuk terhubung.
        </div>

        <form autocomplete="off" name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />
            
            <div class="input-group">
                <input id="username" class="input-field" name="username" type="text" value="$(username)" placeholder="Kode Voucher" required />
            </div>
            
            <div class="input-group" id="password-group" style="display: none;">
                <input id="password" class="input-field" name="password" type="password" placeholder="Password" />
            </div>

            <button class="login-btn" type="submit">Hubungkan Sekarang</button>
        </form>

        <div class="pricing-section">
            <div class="pricing-title">Daftar Paket Internet</div>
            <table class="pricing-table">
                <tr>
                    <th>Paket</th>
                    <th>Masa Aktif</th>
                    <th style="text-align:right;">Harga</th>
                </tr>
                <tr>
                    <td>1 Jam</td>
                    <td>1 Jam</td>
                    <td>Rp 2.000</td>
                </tr>
                <tr>
                    <td>6 Jam</td>
                    <td>6 Jam</td>
                    <td>Rp 5.000</td>
                </tr>
                <tr>
                    <td>1 Hari</td>
                    <td>24 Jam</td>
                    <td>Rp 10.000</td>
                </tr>
                <tr>
                    <td>1 Bulan</td>
                    <td>30 Hari</td>
                    <td>Rp 150.000</td>
                </tr>
            </table>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 Aljuandri - Powered by <a href="#">Bucknet Manager</a>
    </div>

    <script type="text/javascript">
        var hostname = window.location.hostname;
        document.getElementById('title').innerHTML = hostname + " > Login";
        
        var usernameInput = document.getElementById('username');
        var passwordInput = document.getElementById('password');
        var passwordGroup = document.getElementById('password-group');
        var infoLogin = document.getElementById('infologin');
        var btnVoucher = document.getElementById('btn-voucher');
        var btnMember = document.getElementById('btn-member');

        usernameInput.focus();

        function syncPassword() {
            var val = usernameInput.value;
            // usernameInput.value = val.toLowerCase(); // Uncomment if you want to force lowercase
            passwordInput.value = val;
        }

        // Default: Voucher Mode
        usernameInput.onkeyup = syncPassword;

        function setMode(mode) {
            usernameInput.value = "";
            passwordInput.value = "";
            usernameInput.focus();

            if (mode === 'voucher') {
                btnVoucher.classList.add('active');
                btnMember.classList.remove('active');
                usernameInput.placeholder = "Kode Voucher";
                passwordGroup.style.display = "none";
                infoLogin.innerHTML = "Masukkan Kode Voucher Anda untuk terhubung.";
                usernameInput.onkeyup = syncPassword;
            } else {
                btnMember.classList.add('active');
                btnVoucher.classList.remove('active');
                usernameInput.placeholder = "Username Member";
                passwordGroup.style.display = "block";
                infoLogin.innerHTML = "Masukkan Username dan Password Anda.";
                usernameInput.onkeyup = null; // Remove auto sync
            }
        }
    </script>
</body>
</html>
